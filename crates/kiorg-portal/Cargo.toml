[package]
name = "kiorg-portal"
version = "0.1.0"
edition = "2024"
description = "xdg-desktop-portal backend for kiorg file manager"
license = "MIT"

[[bin]]
name = "xdg-desktop-portal-kiorg"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
